# Deploys the pilot patches to the Hostinger VPS and proves them on the live
# server. Runs on a self-hosted runner that exists only on that VPS (label
# jarvis-vps, no default labels), only for pushes to the pilot branch by a
# writer of this repository — never for pull requests.
name: Pilot VPS

on:
  push:
    branches: [claude/it-complete]
    paths: ["scripts/pilot/**", ".github/workflows/pilot-vps.yml"]
  workflow_dispatch:

concurrency:
  group: pilot-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-check:
    runs-on: [self-hosted, jarvis-vps]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pilot
          fetch-depth: 1

      - name: Apply patches and restart
        env:
          JARVIS_PILOT_BASE: file://${{ github.workspace }}/scripts/pilot
        run: bash scripts/pilot/update.sh

      - name: Server still running after the step ended
        run: |
          sleep 10
          pgrep -x jarvis && echo "jarvis running"

      - name: Smoke checks on the live server
        run: ~/.dodaios/.venv/bin/python -I scripts/pilot/check.py

      - name: Server log tail (on failure)
        if: failure()
        run: tail -40 ~/jarvis-serve.log | cut -c1-300
